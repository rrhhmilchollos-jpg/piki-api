services:
  - type: web
    name: piki-api
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: piki
      - key: ADMIN_APP_URL
        value: https://admin.pikidelivery.com
      - key: CORS_ORIGINS
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: CHECKOUT_TOKEN_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PIKI_CUSTOMER_SYNC_SECRET
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: PIKI_HOURLY_GUARANTEE_ENABLED
        value: "false"
      - key: PIKI_RIDER_REFERRALS_ENABLED
        value: "false"
      - key: PIKI_RIDER_INCENTIVES_MONTHLY_CAP_CENTS
        value: "0"
      - key: PIKI_RIDER_COMPENSATION_MODE
        value: founder_partner
      - key: PIKI_RIDER_PAYOUT_CENTS
        value: "0"
      - key: PIKI_INLINE_DISPATCH_WORKER
        value: "false"

  - type: worker
    name: piki-dispatch-worker
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: npm run start:dispatch-worker
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: piki
      - key: PIKI_DISPATCH_WORKER_POLL_MS
        value: "1000"
      - key: PIKI_DISPATCH_WORKER_BATCH_SIZE
        value: "25"
      - key: PIKI_DISPATCH_HEALTH_PORT
        value: "10000"
